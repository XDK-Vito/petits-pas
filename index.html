<head>

<title>Petits Pas</title>
<meta name="description" content="Six petits jeux pour les enfants de 4 à 7 ans avec un syndrome 22q11 : syllabes, loto des sons, fusée à la voix, journée en images, émotions et coin calme.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#EDF4F1; --surface:#FFFFFF; --ink:#1F2B45; --ink-soft:#56627C; --line:#D2E0DB;
  --accent:#2F6FD0; --on-accent:#FFFFFF; --err:#B4232D; --err-bg:#FDE4E6;
  --joie:#FFD23F; --face-ink:#2A2F45; --cheek:#FF8FA3;
  --t1:#FFE8A8; --t2:#CFE6FF; --t3:#DED5FF; --t4:#FFDCCB; --t5:#FFE0EB; --t6:#CDEFE0;
  --shadow:0 2px 0 rgba(31,43,69,.07), 0 14px 32px -16px rgba(31,43,69,.4);
  --f-display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --f-read:"Andika","Verdana","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#10192B;--surface:#1A2540;--ink:#EAF0FA;--ink-soft:#A7B3CB;--line:#2B3A5C;--accent:#7FAAFF;--on-accent:#0E1A33;--err:#FF9AA2;--err-bg:#3D1C22;
    --t1:#3B3420;--t2:#1D3452;--t3:#2C2756;--t4:#45291F;--t5:#45243A;--t6:#173D31;--shadow:0 2px 0 rgba(0,0,0,.28),0 14px 32px -16px rgba(0,0,0,.7);color-scheme:dark}
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-read);font-size:16px;line-height:1.5;
  padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:grid;place-items:center}
.card{width:min(100%,460px);background:var(--surface);border-radius:28px;box-shadow:var(--shadow);padding:28px 24px 22px;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.face{width:88px;height:88px}
h1{font-family:var(--f-display);font-weight:800;font-size:2.4rem;line-height:1;margin:0}
.intro{margin:0;color:var(--ink-soft);font-size:1.02rem;text-wrap:balance}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;display:block}
form{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:4px}
label{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
input{width:100%;min-height:60px;border-radius:16px;border:3px solid var(--line);background:var(--bg);color:var(--ink);
  font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:.14em;text-align:center;text-transform:uppercase;padding:0 12px}
input:focus{outline:none;border-color:var(--accent)}
button{min-height:60px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-family:var(--f-display);font-weight:800;font-size:1.35rem;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.msg{min-height:1.5em;margin:0;font-weight:700}
.msg.err{color:var(--err);background:var(--err-bg);border-radius:12px;padding:8px 12px}
.small{margin:0;font-size:.9rem;color:var(--ink-soft)}
.wait .card form{display:none}
</style>
</head>

<script>
(function(){
'use strict';
var KEY='petitspas:acces';
var D=JSON.parse(document.getElementById('donnees').textContent);
var form=document.getElementById('f'),input=document.getElementById('code'),btn=document.getElementById('go'),msg=document.getElementById('msg');
function b64(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
function norm(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');}
function say(t,err){msg.textContent=t;msg.className='msg'+(err?' err':'');}
function getSaved(){try{var v=localStorage.getItem(KEY);return v?JSON.parse(v):null;}catch(e){return null;}}
function setSaved(c){try{localStorage.setItem(KEY,JSON.stringify(c));}catch(e){}}
function forget(){try{localStorage.removeItem(KEY);}catch(e){}}
async function ouvrir(code){
  var s=crypto.subtle,enc=new TextEncoder();
  var base=await s.importKey('raw',enc.encode(norm(code)),'PBKDF2',false,['deriveKey']);
  var kek=await s.deriveKey({name:'PBKDF2',salt:b64(D.sel),iterations:D.tours,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  var raw=null;
  for(var i=0;i<D.cles.length&&!raw;i++){try{raw=await s.decrypt({name:'AES-GCM',iv:b64(D.cles[i].iv)},kek,b64(D.cles[i].c));}catch(e){}}
  if(!raw) return null;
  var k=await s.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  var html=await s.decrypt({name:'AES-GCM',iv:b64(D.iv)},k,b64(D.appli));
  return new TextDecoder().decode(html);
}
function lancer(html){document.open();document.write(html);document.close();}
if(!window.crypto||!crypto.subtle){say("Ce navigateur est trop ancien. Ouvrez le site avec Chrome, Edge, Firefox ou Safari à jour.",true);btn.disabled=true;return;}
form.addEventListener('submit',async function(e){
  e.preventDefault();
  var c=norm(input.value);
  if(c.length<4){say('Tapez le code reçu (par exemple ABCD-2345).',true);input.focus();return;}
  btn.disabled=true;say('Vérification…');
  try{
    var html=await ouvrir(c);
    if(html){setSaved(c);say('Bienvenue !');lancer(html);return;}
    say("Ce code ne marche pas. Vérifiez les lettres et les chiffres, puis réessayez.",true);
  }catch(err){say("Un problème est survenu. Rechargez la page et réessayez.",true);}
  btn.disabled=false;input.select();
});
var saved=getSaved();
if(saved){
  document.body.classList.add('wait');say('Ouverture…');
  ouvrir(saved).then(function(html){if(html)lancer(html);else{forget();document.body.classList.remove('wait');say("Le code de cet appareil ne marche plus. Tapez le nouveau code.",true);}})
  .catch(function(){forget();document.body.classList.remove('wait');say('');});
}
})();
</script>
